version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:6.0
    container_name: video-conf-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - video-conf-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: video-conf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - video-conf-network

  # API Gateway
  api-gateway:
    build: .
    container_name: video-conf-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_GATEWAY_PORT=3000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/video_conference_main?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - JWT_REFRESH_SECRET=your_super_secret_refresh_key_change_in_production
    command: node services/api-gateway/server.js
    depends_on:
      - mongodb
      - redis
    networks:
      - video-conf-network

  # User Service
  user-service:
    build: .
    container_name: video-conf-user-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - USER_SERVICE_PORT=3003
      - USER_DB_URI=mongodb://admin:password123@mongodb:27017/video_conference_users?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - JWT_REFRESH_SECRET=your_super_secret_refresh_key_change_in_production
    command: node services/user-service/server.js
    depends_on:
      - mongodb
      - redis
    networks:
      - video-conf-network

  # Media Server
  media-server:
    build: .
    container_name: video-conf-media-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MEDIA_SERVER_PORT=3001
      - MEETING_DB_URI=mongodb://admin:password123@mongodb:27017/video_conference_meetings?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
    command: node services/media-server/server.js
    depends_on:
      - mongodb
      - redis
    networks:
      - video-conf-network

  # Chat Service
  chat-service:
    build: .
    container_name: video-conf-chat-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - CHAT_SERVICE_PORT=3002
      - CHAT_DB_URI=mongodb://admin:password123@mongodb:27017/video_conference_chat?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: node services/chat-service/server.js
    depends_on:
      - mongodb
      - redis
    networks:
      - video-conf-network

  # File Service
  file-service:
    build: .
    container_name: video-conf-file-service
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - FILE_SERVICE_PORT=3006
      - FILE_DB_URI=mongodb://admin:password123@mongodb:27017/video_conference_files?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UPLOAD_PATH=/usr/src/app/uploads
    command: node services/file-service/server.js
    depends_on:
      - mongodb
      - redis
    volumes:
      - file_uploads:/usr/src/app/uploads
    networks:
      - video-conf-network

  # Recording Service
  recording-service:
    build: .
    container_name: video-conf-recording-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - RECORDING_SERVICE_PORT=3004
      - RECORDING_DB_URI=mongodb://admin:password123@mongodb:27017/video_conference_recordings?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RECORDING_PATH=/usr/src/app/recordings
    command: node services/recording-service/server.js
    depends_on:
      - mongodb
      - redis
    volumes:
      - recordings:/usr/src/app/recordings
    networks:
      - video-conf-network

  # Notification Service
  notification-service:
    build: .
    container_name: video-conf-notification-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - NOTIFICATION_SERVICE_PORT=3005
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/video_conference_main?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USER=your_email@gmail.com
      - EMAIL_PASS=your_app_password
    command: node services/notification-service/server.js
    depends_on:
      - mongodb
      - redis
    networks:
      - video-conf-network

  # Nginx Load Balancer (Optional)
  nginx:
    image: nginx:alpine
    container_name: video-conf-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway
    networks:
      - video-conf-network

volumes:
  mongodb_data:
  redis_data:
  file_uploads:
  recordings:

networks:
  video-conf-network:
    driver: bridge